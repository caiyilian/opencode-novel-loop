[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dialoop"
version = "0.1.0"
description = "CLI for novel dialogue speaker labeling with an OpenAI-compatible model backend."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "opencode-novel-loop contributors" }]
dependencies = []

[project.scripts]
dialoop = "dialoop.cli:main"

[tool.setuptools]
packages = ["dialoop"]

[tool.setuptools.package-data]
dialoop = ["templates/*.json"]
