[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dialoop"
version = "0.1.0"
description = "CLI for novel dialogue speaker labeling with an OpenAI-compatible model backend."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "opencode-novel-loop contributors" }]
dependencies = []

[project.scripts]
dialoop = "dialoop.cli:main"
dialoop-quality = "dialoop.quality_cli:main"
dialoop-evaluate = "dialoop.quality_cli:evaluate_main"
dialoop-scan-terms = "dialoop.quality_cli:scan_terms_main"
dialoop-annotations-summary = "dialoop.quality_cli:annotations_summary_main"
dialoop-mismatch-attribution = "dialoop.quality_cli:mismatch_attribution_main"
dialoop-verifier-false-pass = "dialoop.quality_cli:verifier_false_pass_main"

[tool.setuptools]
packages = ["dialoop"]

[tool.setuptools.package-data]
dialoop = ["templates/*.json"]
